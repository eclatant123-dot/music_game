<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>계이름 마스터는 누구?!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');

        body {
            font-family: 'Jua', 'Gowun Dodum', 'Noto Sans KR', sans-serif;
            background-color: #f0f4ff;
            touch-action: manipulation; /* Prevents double-tap zoom on mobile */
            overflow: hidden; /* Prevent scrolling */
        }

        .font-jua {
            font-family: 'Jua', sans-serif;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .pop-animation {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fire {
            0% { color: #fbbf24; text-shadow: 0 0 8px #f59e0b; }
            50% { color: #f43f5e; text-shadow: 0 0 15px #ef4444; }
            100% { color: #fbbf24; text-shadow: 0 0 8px #f59e0b; }
        }
        .combo-fire {
            animation: fire 0.8s infinite;
        }

        /* SVG Musical Notation Styling */
        .staff-line { stroke: #334155; stroke-width: 2.5; stroke-linecap: round; }
        .ledger-line { stroke: #334155; stroke-width: 3.5; stroke-linecap: round; }
        .note-head { fill: #1e293b; }
        .note-stem { stroke: #1e293b; stroke-width: 3.5; stroke-linecap: round; }
        .clef-shape { fill: #1e293b; user-select: none; }

        /* Hide scrollbars for the main app container */
        .app-container::-webkit-scrollbar { display: none; }
        .app-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center w-full h-screen p-0 sm:p-4 bg-indigo-50/50">

    <main class="app-container relative w-full max-w-md h-full sm:h-[92vh] bg-white sm:rounded-[2.5rem] shadow-2xl border-0 sm:border-8 border-indigo-100 overflow-hidden flex flex-col">
        
        <!-- Canvas for Fireworks overlay -->
        <canvas id="fireworksCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-50"></canvas>

        <!-- START SCREEN -->
        <div id="startScreen" class="absolute inset-0 z-40 bg-gradient-to-b from-sky-100 via-indigo-50 to-purple-100 flex flex-col items-center justify-between p-6 transition-opacity duration-500">
            <div class="w-full text-center mt-12">
                <h1 class="text-4xl font-black text-slate-800 tracking-tight font-jua">계이름 마스터</h1>
                <p class="text-indigo-400 mt-2 font-bold">신나고 빠르게 계이름 읽기 연습!</p>
            </div>

            <div class="w-full my-auto space-y-4">
                <div class="bg-white/80 backdrop-blur-sm p-4 rounded-3xl shadow-sm border-2 border-indigo-100">
                    <label class="block text-xs font-bold text-slate-400 mb-1 ml-2 text-left">플레이어 닉네임</label>
                    <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요 ⭐" autocomplete="off" maxlength="10" class="w-full px-4 py-3 rounded-2xl bg-indigo-50/50 border-2 border-indigo-100 focus:border-indigo-400 focus:bg-white focus:outline-none text-center font-bold text-slate-700 placeholder-indigo-300 transition-all font-jua text-lg">
                </div>

                <div class="flex flex-col space-y-3">
                    <button onclick="startGame('treble')" class="group relative w-full flex items-center justify-between p-5 bg-white rounded-3xl shadow-md border-2 border-indigo-200 hover:border-indigo-400 hover:shadow-lg active:scale-95 transition-all">
                        <div class="text-left">
                            <span class="text-xs bg-indigo-100 text-indigo-600 px-2.5 py-0.5 rounded-full font-bold mb-1 inline-block">추천</span>
                            <h2 class="text-2xl font-bold text-indigo-600 font-jua">높은음자리표</h2>
                            <p class="text-slate-400 text-xs mt-0.5">가온 도 ~ 고음 솔</p>
                        </div>
                        <span class="text-5xl group-hover:scale-110 transition-transform text-indigo-500 font-serif leading-none pr-2">𝄞</span>
                    </button>

                    <button onclick="startGame('bass')" class="group relative w-full flex items-center justify-between p-5 bg-white rounded-3xl shadow-md border-2 border-pink-200 hover:border-pink-400 hover:shadow-lg active:scale-95 transition-all">
                        <div class="text-left">
                            <span class="text-xs bg-pink-100 text-pink-600 px-2.5 py-0.5 rounded-full font-bold mb-1 inline-block">저음역</span>
                            <h2 class="text-2xl font-bold text-pink-600 font-jua">낮은음자리표</h2>
                            <p class="text-slate-400 text-xs mt-0.5">저음 미 ~ 가온 도</p>
                        </div>
                        <span class="text-5xl group-hover:scale-110 transition-transform text-pink-500 font-serif leading-none pr-2">𝄢</span>
                    </button>
                </div>
            </div>

            <div class="mb-2 text-xs font-bold text-slate-400 text-center bg-white/60 px-4 py-2 rounded-full border border-slate-200/50">
                🔊 볼륨을 켜면 피아노 소리가 들려요! (A4 = 440Hz 기준)
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="gameScreen" class="absolute inset-0 z-30 flex flex-col hidden bg-slate-50">
            
            <!-- Header: Score and Combo -->
            <header class="p-4 bg-white border-b-2 border-indigo-50 rounded-b-3xl shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <button onclick="showStartScreen()" class="p-2 text-slate-400 hover:text-indigo-600 active:bg-indigo-50 rounded-2xl transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    
                    <div class="flex items-center space-x-1 text-sm font-black text-indigo-600 bg-indigo-100/70 px-4 py-1.5 rounded-full font-jua">
                        <span>Q.</span>
                        <span id="questionCount" class="text-base">1 / 20</span>
                    </div>

                    <div class="flex items-center space-x-3">
                        <div class="text-center bg-amber-50 px-3 py-1 rounded-2xl border border-amber-200/60">
                            <div class="text-[10px] text-amber-500 font-bold uppercase tracking-tight">Combo</div>
                            <div id="comboDisplay" class="text-base font-black text-amber-400 leading-none">0</div>
                        </div>
                        <div class="text-center bg-indigo-50 px-3 py-1 rounded-2xl border border-indigo-100">
                            <div class="text-[10px] text-indigo-400 font-bold uppercase tracking-tight">Score</div>
                            <div id="scoreDisplay" class="text-base font-black text-indigo-600 leading-none">0</div>
                        </div>
                    </div>
                </div>

                <!-- Timer Bar -->
                <div class="flex items-center space-x-2">
                    <span class="text-xs">⏱️</span>
                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200/60">
                        <div id="timerBar" class="h-full bg-gradient-to-r from-indigo-400 to-purple-500 w-full rounded-full transition-all duration-75 ease-linear"></div>
                    </div>
                </div>
            </header>

            <!-- Staff Area (SVG based) -->
            <div class="flex-1 flex flex-col items-center justify-center relative w-full px-2">
                <div id="staffContainer" class="w-full max-w-[340px] aspect-[4/3] relative bg-white rounded-3xl p-2 shadow-sm border-2 border-indigo-50 flex items-center justify-center">
                    <svg id="staffSVG" viewBox="0 0 300 240" class="w-full h-full">
                        <!-- Staff Lines -->
                        <g id="staffLines"></g>
                        <!-- Clef (SVG Group for Vector Exact Positioning) -->
                        <g id="clefGroup"></g>
                        <!-- Dynamic Notes -->
                        <g id="noteGroup"></g>
                    </svg>
                </div>
                
                <!-- Feedback overlay (+10 text) -->
                <div id="feedbackText" class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 text-4xl font-black text-emerald-500 opacity-0 pointer-events-none transition-all duration-300 transform scale-50 font-jua">
                    +10
                </div>
            </div>

            <!-- Answer Buttons Area -->
            <div class="p-3 pb-5 bg-white shadow-[0_-10px_25px_rgba(0,0,0,0.03)] rounded-t-[2rem] border-t-2 border-indigo-50">
                <div class="text-center text-xs text-indigo-400 font-bold mb-2.5 flex items-center justify-center space-x-1">
                    <span>🎹</span>
                    <span>알맞은 계이름을 눌러주세요!</span>
                </div>

                <!-- 7 Note buttons in a single horizontal row -->
                <div class="grid grid-cols-7 gap-1.5 mb-2.5">
                    <button class="answer-btn bg-rose-50 hover:bg-rose-100 text-rose-600 border-2 border-rose-200 active:scale-95 rounded-xl py-3 text-lg sm:text-xl font-bold font-jua shadow-sm transition-all text-center px-0" onclick="checkAnswer('도')">도</button>
                    <button class="answer-btn bg-orange-50 hover:bg-orange-100 text-orange-600 border-2 border-orange-200 active:scale-95 rounded-xl py-3 text-lg sm:text-xl font-bold font-jua shadow-sm transition-all text-center px-0" onclick="checkAnswer('레')">레</button>
                    <button class="answer-btn bg-amber-50 hover:bg-amber-100 text-amber-600 border-2 border-amber-200 active:scale-95 rounded-xl py-3 text-lg sm:text-xl font-bold font-jua shadow-sm transition-all text-center px-0" onclick="checkAnswer('미')">미</button>
                    <button class="answer-btn bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border-2 border-emerald-200 active:scale-95 rounded-xl py-3 text-lg sm:text-xl font-bold font-jua shadow-sm transition-all text-center px-0" onclick="checkAnswer('파')">파</button>
                    <button class="answer-btn bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-200 active:scale-95 rounded-xl py-3 text-lg sm:text-xl font-bold font-jua shadow-sm transition-all text-center px-0" onclick="checkAnswer('솔')">솔</button>
                    <button class="answer-btn bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border-2 border-indigo-200 active:scale-95 rounded-xl py-3 text-lg sm:text-xl font-bold font-jua shadow-sm transition-all text-center px-0" onclick="checkAnswer('라')">라</button>
                    <button class="answer-btn bg-purple-50 hover:bg-purple-100 text-purple-600 border-2 border-purple-200 active:scale-95 rounded-xl py-3 text-lg sm:text-xl font-bold font-jua shadow-sm transition-all text-center px-0" onclick="checkAnswer('시')">시</button>
                </div>

                <!-- Full-width Skip/Pass button underneath -->
                <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-500 border-2 border-slate-200 active:scale-95 rounded-xl py-2.5 text-base font-bold font-jua shadow-sm transition-all flex items-center justify-center space-x-1" onclick="skipNote()">
                    <span>패스 ⏩</span>
                </button>
            </div>
        </div>

        <!-- GAME OVER & RANKING SCREEN -->
        <div id="gameOverScreen" class="absolute inset-0 z-50 hidden bg-slate-50 flex-col">
            <div class="p-6 text-center bg-gradient-to-b from-indigo-500 to-purple-600 text-white rounded-b-3xl shadow-md">
                <span class="text-4xl block mb-1">🎉</span>
                <h2 class="text-3xl font-black font-jua mb-1">미션 완료!</h2>
                <p class="text-indigo-100 text-sm font-bold mb-3"><span id="finalNickname" class="text-yellow-300 font-extrabold"></span>님의 최종 점수</p>
                <div class="text-5xl font-black font-jua text-yellow-300 drop-shadow-md" id="finalScoreDisplay">0</div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4">
                <h3 class="text-lg font-bold text-slate-700 mb-3 flex items-center justify-center space-x-1 font-jua">
                    <span>🏆</span>
                    <span>명예의 전당 Top 50</span>
                    <span>🏆</span>
                </h3>
                <ul id="leaderboardList" class="space-y-2 pb-4">
                    <li class="text-center text-slate-400 text-sm py-4">순위를 불러오는 중...</li>
                </ul>
            </div>
            
            <div class="p-4 bg-white border-t border-slate-100">
                <button onclick="showStartScreen()" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 active:scale-95 transition-all rounded-2xl text-white font-bold text-xl font-jua shadow-md">다시 도전하기 🔄</button>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let user = null;

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth init failed", error);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (u) => { 
            user = u; 
        });

        window.saveScoreToFirebase = async (nickname, score) => {
            if(!user) return;
            try {
                const dbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                await addDoc(dbRef, {
                    nickname: nickname,
                    score: score,
                    timestamp: Date.now()
                });
            } catch(e) {
                console.error("Save error", e);
            }
        };

        let unsubscribe = null;
        window.listenToLeaderboard = (callback) => {
            if(!user) {
                callback([]);
                return;
            }
            const dbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(dbRef, (snapshot) => {
                let docs = [];
                snapshot.forEach(doc => docs.push(doc.data()));
                docs.sort((a,b) => b.score - a.score);
                callback(docs.slice(0, 50)); 
            }, (error) => {
                console.error("Listen error", error);
                callback([]);
            });
        };
        window.stopLeaderboardListen = () => {
            if (unsubscribe) unsubscribe();
        };
    </script>

    <script>
        // Standard Pitch Reference: A4 = 440Hz
        // Notes Data (Treble Clef & Bass Clef)
        const notesTreble = [
            { name: '도', step: -6, pitch: "C4" },
            { name: '레', step: -5, pitch: "D4" },
            { name: '미', step: -4, pitch: "E4" },
            { name: '파', step: -3, pitch: "F4" },
            { name: '솔', step: -2, pitch: "G4" },
            { name: '라', step: -1, pitch: "A4" }, // Standard A4 (440Hz)
            { name: '시', step: 0, pitch: "B4" },
            { name: '도', step: 1, pitch: "C5" },
            { name: '레', step: 2, pitch: "D5" },
            { name: '미', step: 3, pitch: "E5" },
            { name: '파', step: 4, pitch: "F5" },
            { name: '솔', step: 5, pitch: "G5" }
        ];

        const notesBass = [
            { name: '미', step: -6, pitch: "E2" },
            { name: '파', step: -5, pitch: "F2" },
            { name: '솔', step: -4, pitch: "G2" },
            { name: '라', step: -3, pitch: "A2" },
            { name: '시', step: -2, pitch: "B2" },
            { name: '도', step: -1, pitch: "C3" },
            { name: '레', step: 0, pitch: "D3" },
            { name: '미', step: 1, pitch: "E3" },
            { name: '파', step: 2, pitch: "F3" },
            { name: '솔', step: 3, pitch: "G3" },
            { name: '라', step: 4, pitch: "A3" },
            { name: '시', step: 5, pitch: "B3" },
            { name: '도', step: 6, pitch: "C4" }
        ];

        // Game State Variables
        let currentMode = 'treble';
        let currentNote = null;
        let score = 0;
        let combo = 0;
        let isProcessing = false;
        
        let nickname = "";
        let currentQuestion = 0;
        const MAX_QUESTIONS = 20;

        // Timer Variables
        const TIME_LIMIT = 10000; // 10 seconds per question
        let startTime;
        let timerInterval;

        // Tone.js Instruments (Piano Sound Synthesizer & Effects)
        let pianoSynth, wrongSynth, cheerNoise, cheerFilter;

        async function initAudio() {
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }
            if(!pianoSynth) {
                pianoSynth = new Tone.PolySynth(Tone.Synth, {
                    volume: 0,
                    oscillator: { type: "triangle" },
                    envelope: {
                        attack: 0.005,
                        decay: 1.5,
                        sustain: 0.15,
                        release: 0.8
                    }
                }).toDestination();

                wrongSynth = new Tone.Synth({
                    volume: -8,
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.25, sustain: 0, release: 0.1 }
                }).toDestination();

                cheerFilter = new Tone.Filter(300, "lowpass").toDestination();
                cheerNoise = new Tone.NoiseSynth({
                    volume: -6,
                    noise: { type: "pink" },
                    envelope: { attack: 0.1, decay: 1.2, sustain: 0, release: 0.1 }
                }).connect(cheerFilter);
            }
        }

        async function startGame(mode) {
            const nickInput = document.getElementById('nicknameInput');
            nickname = nickInput.value.trim();
            
            if (!nickname) {
                nickInput.classList.add('shake-animation', 'border-rose-500');
                setTimeout(() => nickInput.classList.remove('shake-animation', 'border-rose-500'), 400);
                return;
            }

            await initAudio();
            
            currentMode = mode;
            score = 0;
            combo = 0;
            currentQuestion = 0;
            updateScoreUI();
            
            document.getElementById('startScreen').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                initStaff();
                loadNextNote();
            }, 500);
        }

        function showStartScreen() {
            stopTimer();
            if(window.stopLeaderboardListen) window.stopLeaderboardListen();
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            const startDiv = document.getElementById('startScreen');
            startDiv.classList.remove('hidden');
            setTimeout(() => {
                startDiv.classList.remove('opacity-0');
            }, 10);
        }

        // SVG Staff Exact Line Y Coordinates:
        // Line 5 (Top, F5/A3): Y = 88   [Space 4: Y = 96]
        // Line 4 (D5/F3):     Y = 104  [Space 3: Y = 112]
        // Line 3 (Mid, B4/D3):Y = 120  [Space 2: Y = 128]
        // Line 2 (G4/B2):     Y = 136  [Space 1: Y = 144]
        // Line 1 (Bot, E4/G2): Y = 152
        const SVG_Y_CENTER = 120;
        const LINE_SPACING = 16;
        const STEP_SIZE = LINE_SPACING / 2; // 8px

        function initStaff() {
            const linesGroup = document.getElementById('staffLines');
            linesGroup.innerHTML = '';
            
            // Draw 5 main staff lines
            for(let i = -2; i <= 2; i++) {
                const y = SVG_Y_CENTER + (i * LINE_SPACING);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", "20");
                line.setAttribute("x2", "280");
                line.setAttribute("y1", y);
                line.setAttribute("y2", y);
                line.setAttribute("class", "staff-line");
                linesGroup.appendChild(line);
            }

            // Draw Vector Perfect Musical Clef
            const clefGroup = document.getElementById('clefGroup');
            clefGroup.innerHTML = '';

            if(currentMode === 'treble') {
                // High Quality Vector High G-Clef
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.textContent = '𝄞';
                text.setAttribute("x", "20");
                text.setAttribute("y", "162");
                text.setAttribute("font-size", "110");
                text.setAttribute("class", "clef-shape");
                text.setAttribute("font-family", "serif");
                clefGroup.appendChild(text);
            } else {
                // BASS CLEF (𝄢) EXACT VECTOR DRAWING BASED ON F3 (4th Line, Y=104)
                // 1. Big Head Circle starting exactly on 4th Line (X=40, Y=104)
                const head = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                head.setAttribute("cx", "42");
                head.setAttribute("cy", "104"); // 4th line
                head.setAttribute("r", "7.5");
                head.setAttribute("fill", "#1e293b");
                clefGroup.appendChild(head);

                // 2. Thick Curved Hook sweeping up to line 5 (Y=88) and fading down to space 1 (Y=144)
                const hook = document.createElementNS("http://www.w3.org/2000/svg", "path");
                // Path designed to wrap around 4th line
                const d = "M 42 104 C 42 84, 76 80, 76 106 C 76 128, 56 156, 42 166 C 40.5 167, 39 165, 40.5 163.5 C 54 153, 70 128, 70 106 C 70 88, 48 88, 42 101 Z";
                hook.setAttribute("d", d);
                hook.setAttribute("fill", "#1e293b");
                clefGroup.appendChild(hook);

                // 3. Dot 1: In Space 4 (between Line 4 [Y=104] & Line 5 [Y=88]) -> Y = 96
                const dotTop = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dotTop.setAttribute("cx", "85");
                dotTop.setAttribute("cy", "96"); // Space 4 (Upper dot)
                dotTop.setAttribute("r", "4.5");
                dotTop.setAttribute("fill", "#1e293b");
                clefGroup.appendChild(dotTop);

                // 4. Dot 2: In Space 3 (between Line 3 [Y=120] & Line 4 [Y=104]) -> Y = 112
                const dotBottom = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dotBottom.setAttribute("cx", "85");
                dotBottom.setAttribute("cy", "112"); // Space 3 (Lower dot)
                dotBottom.setAttribute("r", "4.5");
                dotBottom.setAttribute("fill", "#1e293b");
                clefGroup.appendChild(dotBottom);
            }
        }

        function loadNextNote() {
            if (currentQuestion >= MAX_QUESTIONS) {
                endGame();
                return;
            }
            currentQuestion++;
            document.getElementById('questionCount').innerText = `${currentQuestion} / ${MAX_QUESTIONS}`;

            const sourceArray = currentMode === 'treble' ? notesTreble : notesBass;
            let nextNote = sourceArray[Math.floor(Math.random() * sourceArray.length)];
            
            // Prevent same note twice in a row
            while(currentNote && nextNote.pitch === currentNote.pitch) {
                nextNote = sourceArray[Math.floor(Math.random() * sourceArray.length)];
            }
            currentNote = nextNote;

            drawNote(currentNote);
            startTimer();
        }

        function drawNote(note) {
            const noteGroup = document.getElementById('noteGroup');
            noteGroup.innerHTML = '';

            const cy = SVG_Y_CENTER - (note.step * STEP_SIZE);
            const cx = 175;

            // 1. Draw Ledger Lines (덧줄)
            for(let y = 72; y >= cy; y -= LINE_SPACING) {
                drawLedgerLine(noteGroup, cx, y);
            }
            for(let y = 168; y <= cy; y += LINE_SPACING) {
                drawLedgerLine(noteGroup, cx, y);
            }

            // 2. Draw Note Head
            const head = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
            head.setAttribute("cx", cx);
            head.setAttribute("cy", cy);
            head.setAttribute("rx", "12");
            head.setAttribute("ry", "9");
            head.setAttribute("transform", `rotate(-15 ${cx} ${cy})`);
            head.setAttribute("class", "note-head pop-animation");
            noteGroup.appendChild(head);

            // 3. Draw Stem
            const stem = document.createElementNS("http://www.w3.org/2000/svg", "line");
            stem.setAttribute("class", "note-stem pop-animation");
            
            if (cy > SVG_Y_CENTER) {
                stem.setAttribute("x1", cx + 10);
                stem.setAttribute("x2", cx + 10);
                stem.setAttribute("y1", cy);
                stem.setAttribute("y2", cy - 40);
            } else {
                stem.setAttribute("x1", cx - 10);
                stem.setAttribute("x2", cx - 10);
                stem.setAttribute("y1", cy);
                stem.setAttribute("y2", cy + 40);
            }
            noteGroup.appendChild(stem);
        }

        function drawLedgerLine(parent, cx, y) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", cx - 22);
            line.setAttribute("x2", cx + 22);
            line.setAttribute("y1", y);
            line.setAttribute("y2", y);
            line.setAttribute("class", "ledger-line");
            parent.appendChild(line);
        }

        function startTimer() {
            stopTimer();
            startTime = Date.now();
            timerInterval = requestAnimationFrame(updateTimer);
        }

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, TIME_LIMIT - elapsed);
            const percentage = (remaining / TIME_LIMIT) * 100;
            
            const timerBar = document.getElementById('timerBar');
            timerBar.style.width = percentage + '%';
            
            if (percentage > 50) {
                timerBar.className = "h-full w-full rounded-full bg-gradient-to-r from-indigo-400 to-purple-500 transition-all duration-75";
            } else if (percentage > 20) {
                timerBar.className = "h-full w-full rounded-full bg-amber-400 transition-all duration-75";
            } else {
                timerBar.className = "h-full w-full rounded-full bg-rose-500 transition-all duration-75";
            }
            
            if (remaining > 0) {
                timerInterval = requestAnimationFrame(updateTimer);
            } else {
                handleTimeOut();
            }
        }

        function stopTimer() {
            if (timerInterval) {
                cancelAnimationFrame(timerInterval);
            }
            document.getElementById('timerBar').style.width = '0%';
        }

        function handleTimeOut() {
            if (isProcessing) return;
            isProcessing = true;
            
            combo = 0;
            playWrongSound();
            updateScoreUI();
            
            const staffContainer = document.getElementById('staffContainer');
            staffContainer.classList.add('shake-animation');
            
            setTimeout(() => {
                staffContainer.classList.remove('shake-animation');
                isProcessing = false;
                loadNextNote();
            }, 400);
        }

        function skipNote() {
            if (isProcessing) return;
            combo = 0;
            updateScoreUI();
            stopTimer();
            loadNextNote();
        }

        function checkAnswer(answerName) {
            if (isProcessing || !currentNote) return;
            isProcessing = true;
            stopTimer();

            const isCorrect = answerName === currentNote.name;
            const staffContainer = document.getElementById('staffContainer');

            if (isCorrect) {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, TIME_LIMIT - elapsed);
                const timeBonus = Math.floor((remaining / TIME_LIMIT) * 10);

                combo++;
                const points = 10 + timeBonus + (Math.floor(combo / 2) * 5);
                score += points;
                
                // Play Piano Sound of the Correct Note (A4 = 440Hz)
                playPianoCorrectSound(currentNote.pitch, combo);
                showScoreFeedback(points);
                spawnFireworks();
                updateScoreUI();

                setTimeout(() => {
                    isProcessing = false;
                    loadNextNote();
                }, 450);

            } else {
                combo = 0;
                playWrongSound();
                updateScoreUI();
                
                staffContainer.classList.add('shake-animation');
                setTimeout(() => {
                    staffContainer.classList.remove('shake-animation');
                    isProcessing = false;
                    loadNextNote();
                }, 400);
            }
        }

        function endGame() {
            stopTimer();
            document.getElementById('gameScreen').classList.add('hidden');
            const gameOverDiv = document.getElementById('gameOverScreen');
            gameOverDiv.classList.remove('hidden');
            gameOverDiv.classList.add('flex');
            
            document.getElementById('finalNickname').innerText = nickname;
            document.getElementById('finalScoreDisplay').innerText = score;

            if(window.saveScoreToFirebase) {
                window.saveScoreToFirebase(nickname, score);
            }
            
            if(window.listenToLeaderboard) {
                window.listenToLeaderboard((ranks) => {
                    const listEl = document.getElementById('leaderboardList');
                    listEl.innerHTML = '';
                    if (ranks.length === 0) {
                        listEl.innerHTML = '<li class="text-center text-slate-400 text-sm py-4">아직 기록이 없습니다.</li>';
                        return;
                    }
                    ranks.forEach((r, idx) => {
                        const isMe = (r.nickname === nickname && r.score === score);
                        const li = document.createElement('li');
                        li.className = `flex justify-between items-center p-3.5 rounded-2xl ${isMe ? 'bg-indigo-100/80 border-2 border-indigo-300 font-bold' : 'bg-white border border-slate-100'}`;
                        
                        let badge = `<span class="w-6 text-center font-bold text-slate-400 font-jua">${idx + 1}</span>`;
                        if(idx === 0) badge = `<span class="w-6 text-center text-lg">🥇</span>`;
                        else if(idx === 1) badge = `<span class="w-6 text-center text-lg">🥈</span>`;
                        else if(idx === 2) badge = `<span class="w-6 text-center text-lg">🥉</span>`;

                        li.innerHTML = `
                            <div class="flex items-center">
                                ${badge}
                                <span class="ml-2.5 font-bold text-slate-700 font-jua text-base">${r.nickname}</span>
                            </div>
                            <span class="font-black text-indigo-600 font-jua text-lg">${r.score}점</span>
                        `;
                        listEl.appendChild(li);
                    });
                });
            }
        }

        // Plays Piano Tone for the exact pitch (A4 = 440Hz base)
        function playPianoCorrectSound(pitch, currentCombo) {
            if(!pianoSynth) return;
            const now = Tone.now();
            
            pianoSynth.triggerAttackRelease(pitch, "2n", now);
            
            if (currentCombo > 0 && currentCombo % 3 === 0) {
                cheerFilter.frequency.value = 300;
                cheerNoise.triggerAttackRelease("1n", now + 0.05);
                cheerFilter.frequency.rampTo(2500, 0.4, now + 0.05);
            }
        }

        function playWrongSound() {
            if(!wrongSynth) return;
            wrongSynth.triggerAttackRelease("Bb2", "8n");
        }

        function updateScoreUI() {
            document.getElementById('scoreDisplay').innerText = score;
            const comboEl = document.getElementById('comboDisplay');
            comboEl.innerText = combo;

            if (combo >= 3) {
                comboEl.classList.add('combo-fire');
                comboEl.classList.remove('text-amber-400');
            } else {
                comboEl.classList.remove('combo-fire');
                comboEl.classList.add('text-amber-400');
            }
        }

        function showScoreFeedback(points) {
            const fb = document.getElementById('feedbackText');
            fb.innerText = `+${points}`;
            
            fb.classList.remove('opacity-0', 'scale-50', '-translate-y-10');
            fb.classList.add('opacity-100', 'scale-100');
            
            void fb.offsetWidth;
            
            fb.classList.add('opacity-0', 'scale-125', '-translate-y-10');
        }

        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let canvasWidth, canvasHeight;

        function resizeCanvas() {
            canvasWidth = canvas.parentElement.clientWidth;
            canvasHeight = canvas.parentElement.clientHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.size = Math.random() * 4 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.alpha -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnFireworks() {
            const colors = ['#f43f5e', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6'];
            const staffRect = document.getElementById('staffContainer').getBoundingClientRect();
            const appRect = document.querySelector('.app-container').getBoundingClientRect();
            
            const x = (staffRect.left - appRect.left) + staffRect.width / 2;
            const y = (staffRect.top - appRect.top) + staffRect.height / 2;

            for(let i=0; i<30; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if(p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            requestAnimationFrame(animateFireworks);
        }
        
        window.onload = function() {
            resizeCanvas();
            animateFireworks();
        }
    </script>
</body>
</html>
